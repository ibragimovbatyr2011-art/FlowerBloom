<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4f1; --bg2:#fbdce6; --ink:#5b2640; --soft:#8a5069;
  --p1:#f7b6c8; --p2:#f09ab4; --p3:#e97fa0; --p4:#de6690; --core:#f4c542;
  --l1:#fff7ee; --l2:#ffd9c2; --l3:#f6a98c;
  --btn:#5b2640; --btnink:#fff4f1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1420; --bg2:#44213a; --ink:#ffe6ee; --soft:#e2b3c6;
    --btn:#ffe6ee; --btnink:#2a1420;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1420; --bg2:#44213a; --ink:#ffe6ee; --soft:#e2b3c6;
  --btn:#ffe6ee; --btnink:#2a1420;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 70%);
  color:var(--ink);
  font-family:"Jost",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 20px 40px; overflow-x:hidden;
}
canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2}
main{position:relative; z-index:1; width:100%; max-width:560px; text-align:center}
.garden{display:flex; align-items:flex-end; justify-content:center; margin:0 auto 8px}
.garden svg{display:block; overflow:visible}
.lily{width:34%; margin-bottom:6%}
.lily.l{margin-right:-6%}
.lily.r{margin-left:-6%}
.peony{width:58%; position:relative; z-index:1}
.pt{
  transform:rotate(var(--r)) scale(.04); opacity:0; transform-origin:0 0;
  transition:transform 1.6s cubic-bezier(.2,.9,.25,1) var(--d), opacity .9s ease var(--d);
}
.bloom .pt{transform:rotate(var(--r)) scale(1); opacity:1}
.bud{transition:opacity .6s ease .2s}
.bloom .bud{opacity:0}
.stem{stroke:#6f9a6a; stroke-width:3; fill:none; stroke-linecap:round}
.core{fill:var(--core); transform:scale(.3); transform-origin:0 0; transition:transform 1.4s ease 1.4s}
.bloom .core{transform:scale(1)}
.msg{opacity:0; transform:translateY(8px); transition:opacity 1.4s ease 1.8s, transform 1.4s ease 1.8s}
.bloom .msg{opacity:1; transform:none}
h1{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
  font-size:clamp(2.2rem,9vw,3.4rem); line-height:1.05; margin:.2em 0 .35em;
}
.text{
  font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(1.2rem,4.6vw,1.5rem);
  line-height:1.5; max-width:30em; margin:0 auto .8em;
}
.sign{font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-size:1.25rem; color:var(--soft)}
.open{
  font:inherit; font-size:1.05rem; letter-spacing:.02em; cursor:pointer;
  background:var(--btn); color:var(--btnink); border:0; border-radius:999px;
  padding:14px 30px; transition:opacity .5s ease, transform .2s ease;
}
.open:hover{transform:translateY(-2px)}
.open:focus-visible{outline:3px solid var(--p3); outline-offset:3px}
.bloom .open{opacity:0; pointer-events:none; position:absolute; left:-9999px}
.hint{margin:0 0 18px; color:var(--soft); font-size:.95rem}
.bloom .hint{display:none}
@media (prefers-reduced-motion:reduce){
  .pt,.core,.msg,.bud{transition-duration:.01s; transition-delay:0s}
}
</style>
</head>
<body>
<canvas id="fall" aria-hidden="true"></canvas>
<audio id="song" src="reflections.mp3" preload="auto"></audio>
<main id="card">
  <div class="garden" aria-hidden="true">
    <svg class="lily l" id="lilyL" viewBox="-100 -100 200 200"></svg>
    <svg class="peony" id="peony" viewBox="-100 -100 200 200"></svg>
    <svg class="lily r" id="lilyR" viewBox="-100 -100 200 200"></svg>
  </div>

  <p class="hint">Для тебя кое-что распускается</p>
  <button class="open" id="open" type="button">Раскрыть</button>

  <section class="msg" aria-live="polite">
    <h1 id="title"></h1>
    <p class="text" id="text"></p>
    <p class="sign" id="sign"></p>
  </section>
</main>

<script>
// Поменяй эти три строки на свои слова
const TO   = "Оля";
const TEXT = "Пусть в твоей жизни будет много тёплых дней, а настроение расцветает так же щедро, как пионы в июне. Ты светлая, как лилии на рассвете, и рядом с тобой всегда хочется улыбаться. Спасибо, что ты есть.";
const FROM = "Батыр";

document.getElementById("title").textContent = TO;
document.getElementById("text").textContent = TEXT;
document.getElementById("sign").textContent = FROM;

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function round(L, w){
  return `M0 0C${-w} ${-L*.2} ${-w*1.15} ${-L*.8} 0 ${-L}C${w*1.15} ${-L*.8} ${w} ${-L*.2} 0 0Z`;
}
function pointed(L, w){
  return `M0 0C${-w} ${-L*.3} ${-w*.7} ${-L*.78} 0 ${-L}C${w*.7} ${-L*.78} ${w} ${-L*.3} 0 0Z`;
}

// Пион: слои лепестков от внешнего к внутреннему
const peony = document.getElementById("peony");
const layers = [
  {n:9, L:90, w:36, c:"var(--p1)", off:0},
  {n:8, L:74, w:32, c:"var(--p2)", off:20},
  {n:7, L:58, w:27, c:"var(--p3)", off:8},
  {n:6, L:42, w:21, c:"var(--p4)", off:30},
  {n:5, L:26, w:14, c:"var(--p3)", off:12}
];
layers.forEach((ly, i) => {
  for (let k = 0; k < ly.n; k++){
    el("path", {
      class:"pt", d:round(ly.L, ly.w), fill:ly.c,
      stroke:"rgba(120,30,70,.18)", "stroke-width":".8",
      style:`--r:${ly.off + k*360/ly.n}deg; --d:${(i*.28 + k*.03).toFixed(2)}s`
    }, peony);
  }
});
el("circle", {class:"core", r:"7"}, peony);
el("circle", {class:"bud", r:"16", fill:"var(--p3)"}, peony);

// Лилии: шесть острых лепестков + тычинки
function lily(id, rot, delay){
  const s = document.getElementById(id);
  for (let k = 0; k < 6; k++){
    const back = k % 2 === 0;
    el("path", {
      class:"pt", d:pointed(back ? 92 : 80, back ? 20 : 18),
      fill: back ? "var(--l2)" : "var(--l1)",
      stroke:"rgba(160,70,50,.25)", "stroke-width":".8",
      style:`--r:${rot + k*60}deg; --d:${(delay + k*.1).toFixed(2)}s`
    }, s);
  }
  for (let k = 0; k < 6; k++){
    const a = rot + k*60 + 30;
    const g = el("g", {class:"pt", style:`--r:${a}deg; --d:${delay + 1.1}s`}, s);
    el("line", {x1:0, y1:0, x2:0, y2:-34, stroke:"var(--l3)", "stroke-width":"1.6"}, g);
    el("circle", {cx:0, cy:-36, r:3, fill:"#c9622f"}, g);
  }
}
lily("lilyL", 10, .5);
lily("lilyR", 40, .8);

// Падающие лепестки
const cv = document.getElementById("fall"), cx = cv.getContext("2d");
let W = 0, H = 0, petals = [], running = false;
function size(){
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize", size); size();
const cols = ["#f7b6c8","#f09ab4","#ffe3d3","#fff7ee","#e97fa0"];
function spawn(initial){
  return {
    x:Math.random()*W, y:initial ? -Math.random()*H : -20,
    s:6 + Math.random()*9, v:.5 + Math.random()*1.1,
    sw:Math.random()*Math.PI*2, sp:.01 + Math.random()*.02,
    r:Math.random()*Math.PI*2, rv:(Math.random()-.5)*.04,
    c:cols[(Math.random()*cols.length)|0]
  };
}
function tick(){
  cx.clearRect(0,0,W,H);
  for (const p of petals){
    p.y += p.v; p.sw += p.sp; p.r += p.rv;
    p.x += Math.sin(p.sw)*.8;
    if (p.y > H + 20) Object.assign(p, spawn(false), {x:Math.random()*W});
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = .85; cx.fillStyle = p.c;
    cx.beginPath(); cx.ellipse(0, 0, p.s*.5, p.s, 0, 0, Math.PI*2); cx.fill();
    cx.restore();
  }
  requestAnimationFrame(tick);
}
function startPetals(){
  if (running || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  running = true;
  for (let i = 0; i < 34; i++) petals.push(spawn(true));
  tick();
}

// Музыка: положи файл reflections.mp3 рядом с этим html.
// START_AT — секунда трека, с которой начать (поставь момент, который она любит)
const START_AT = 40;
const song = document.getElementById("song");
function playSong(){
  const seek = () => { try { song.currentTime = START_AT; } catch (e) {} };
  if (song.readyState >= 1) seek();
  else song.addEventListener("loadedmetadata", seek, {once:true});
  song.volume = 0;
  song.play().then(() => {
    let v = 0;
    const t = setInterval(() => {
      v = Math.min(1, v + .05);
      song.volume = v;
      if (v >= 1) clearInterval(t);
    }, 100);
  }).catch(() => {});
}

const card = document.getElementById("card");
document.getElementById("open").addEventListener("click", () => {
  card.classList.add("bloom");
  playSong();
  setTimeout(startPetals, 1600);
});
</script>
</body>
</html>
